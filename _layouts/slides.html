<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    {% seo %}

    <link rel="stylesheet" href="{{ "/assets/reveal.js/dist/reset.css" | prepend: site.baseurl }}"/>
    <link rel="stylesheet" href="{{ "/assets/reveal.js/dist/reveal.css" | prepend: site.baseurl }}"/>
    <link rel="stylesheet" href="{{ "/assets/reveal.js/dist/theme/black.css" | prepend: site.baseurl }}"/>
    <link rel="stylesheet" href="{{ "/assets/reveal.js/plugin/highlight/monokai.css" | prepend: site.baseurl }}"/>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        {{ content }}
      </div>
    </div>

    <script src="{{ "/assets/reveal.js/dist/reveal.js" | prepend: site.baseurl }}"></script>
    <script src="{{ "/assets/reveal.js/plugin/notes/notes.js" | prepend: site.baseurl }}"></script>
    <script src="{{ "/assets/reveal.js/plugin/markdown/markdown.js" | prepend: site.baseurl }}"></script>
    <script src="{{ "/assets/reveal.js/plugin/highlight/highlight.js" | prepend: site.baseurl }}"></script>
    <script src="{{ "/assets/reveal.js/plugin/math/math.js" | prepend: site.baseurl }}"></script>

    <script>
      Reveal.initialize({
        hash: true,
        autoPlayMedia: true,
        progress: false,
        slideNumber: 'c/t',
        controls: false,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.MathJax3],
        mathjax3: {
          tex: {
            packages: ['base','ams'],
            inlineMath: [['\\(','\\)'], ['$', '$']],
            displayMath: [['\\[','\\]'], ['$$','$$']]
          }
        }
      });
    </script>

    <script>
      // Spila eða pása öll video á núverandi glæru
      function toggleVideosOnCurrent() {
        const slide = Reveal.getCurrentSlide();
        if (!slide) return;
        slide.querySelectorAll('video').forEach(v => {
          if (v.paused) { v.play().catch(()=>{}); } else { v.pause(); }
        });
      }

      // Pása media þegar skipt er af glæru
      function pauseMediaIn(slide) {
        if (!slide) return;
        slide.querySelectorAll('video, audio').forEach(m => { try { m.pause(); } catch(_){} });
      }
      Reveal.on('slidechanged', e => pauseMediaIn(e.previousSlide));

      // R400 mapping: Punktur (.) / B / F5 / MediaPlayPause → PLAY/PAUSE
      window.addEventListener('keydown', (e) => {
        const isPlayPause =
          e.key === '.' || e.key === 'b' || e.key === 'B' ||
          e.key === 'F5' || e.code === 'MediaPlayPause';

        if (isPlayPause) {
          e.preventDefault();
          e.stopPropagation();
          toggleVideosOnCurrent();
        }
      }, true);
    </script>
  </body>
</html>
